name: Build CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022 # 选择 Windows

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # 与本地一致

    - name: Install Conan
      run: pip install conan

    - name: Configure Conan Profile
      run: conan profile detect --force
      
    - name: Generate Key Pair for CI
      shell: bash # 强制使用 bash 以便在 Windows 上用 mkdir -p 和 openssl 命令
      run: |
        mkdir -p keyPair
        openssl genpkey -algorithm RSA -out keyPair/private.pem -pkeyopt rsa_keygen_bits:2048
        openssl rsa -pubout -in keyPair/private.pem -out keyPair/public.pem
    
    # 使用默认的官方 Conan Center
    - name: Build Project
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build --config Debug

    - name: Install Python Test Dependencies
      run: |
        pip install -r requirements.txt

    # 使用NanoMQ作为Broker
    - name: Run Contract Tests
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://www.emqx.com/en/downloads/nanomq/0.18.2/nanomq-0.18.2-windows-x86_64.zip" -OutFile "nanomq.zip"
        Expand-Archive -Path "nanomq.zip" -DestinationPath "nanomq" -Force
        $exePath = (Get-ChildItem -Path "nanomq" -Recurse -Filter "nanomq.exe" | Select-Object -First 1).FullName
        Start-Process -FilePath $exePath -ArgumentList "start" -NoNewWindow
        
        $maxRetries = 10
        $retryCount = 0
        $brokerReady = $false
        while (-not $brokerReady -and $retryCount -lt $maxRetries) {
            Start-Sleep -Seconds 2
            $portCheck = netstat -ano | findstr 1883
            if ($portCheck) {
                $brokerReady = $true
                Write-Host "✅ NanoMQ 已成功启动，1883 端口正在监听！"
            } else {
                $retryCount++
                Write-Host "等待 NanoMQ 启动... 第 $retryCount 次重试"
            }
        }
        if (-not $brokerReady) {
            Write-Error "❌ NanoMQ 启动失败，1883 端口未监听！"
            exit 1
        }
        
        Start-Process -FilePath "build\bin\service.exe" -NoNewWindow
        Start-Sleep -Seconds 5
        
        pytest test_contract.py -v -s --tb=short

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: service-exe
        path: build/bin/service.exe
